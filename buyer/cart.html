<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart - ROOTS & CRAFTS</title>
  <style>
    :root {
      --primary: #0077cc;
      --accent: #ff6600;
      --secondary: #f9f9f9;
      --dark: #333;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', sans-serif; background:var(--secondary); color:var(--dark); }

    header {
      background: var(--primary);
      color: white;
      padding: 15px 20px;
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
    }
    header h2 a { color:white; text-decoration:none; }
    nav a {
      color:white; margin:0 10px; text-decoration:none; font-weight:bold; transition:0.3s;
    }
    nav a:hover { color:var(--accent); }
    nav button {
      margin-left:15px; padding:6px 12px; border:none; border-radius:5px; cursor:pointer; background:#ff3300; color:white; transition:0.3s;
    }
    nav button:hover { background:#ff6600; }

    main {
      max-width:1000px; margin:40px auto; padding:20px;
    }

    h1 { color: var(--primary); margin-bottom:20px; text-align:center; }

    table {
      width:100%; border-collapse:collapse; background:white; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }
    th, td { padding:12px; text-align:left; border-bottom:1px solid #ddd; }
    th { background: var(--primary); color:white; }
    td img { width:60px; border-radius:6px; }

    button.qty-btn { padding:4px 8px; margin:0 2px; border:none; border-radius:5px; cursor:pointer; background:#0077cc; color:white; }
    button.qty-btn:hover { background:var(--accent); }
    button.remove-btn { padding:6px 10px; border:none; border-radius:5px; cursor:pointer; background:red; color:white; }
    button.remove-btn:hover { background:darkred; }

    .checkout-btn { margin-top:20px; padding:12px 20px; border:none; border-radius:6px; background:var(--primary); color:white; cursor:pointer; font-size:1rem; transition:0.3s; }
    .checkout-btn:hover { background:var(--accent); }

    footer { margin-top:40px; padding:20px; text-align:center; background:var(--dark); color:white; }
  </style>
</head>
<body>

<header>
  <h2><a href="index.html">ROOTS & CRAFTS</a></h2>
  <nav>
    <a href="index.html">Home</a> 
    <a href="about.html">About</a>
    <a href="help.html">Help</a>
    <a href="cart.html">Cart</a>
    <button onclick="logout()">Logout</button>
  </nav>
</header>

<main>
  <h1>Shopping Cart</h1>

  <table id="cartTable">
    <thead>
      <tr>
        <th>Product</th>
        <th>Name</th>
        <th>Price (₹)</th>
        <th>Quantity</th>
        <th>Total (₹)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- JS renders cart items here -->
    </tbody>
  </table>

  <button class="checkout-btn" onclick="checkout()">Checkout</button>
</main>

<footer>
  <p>© 2025 SHG Marketplace | Empowering Local Communities</p>
</footer>

<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function renderCart() {
    const tbody = document.querySelector("#cartTable tbody");
    if(cart.length === 0){
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Cart is empty.</td></tr>';
      return;
    }

    tbody.innerHTML = cart.map((p,i) => `
      <tr>
        <td><img src="${p.img}" alt="${p.name}"></td>
        <td>${p.name}</td>
        <td>${p.price}</td>
        <td>
          <button class="qty-btn" onclick="updateQuantity(${i}, -1)">-</button>
          ${p.quantity}
          <button class="qty-btn" onclick="updateQuantity(${i}, 1)">+</button>
        </td>
        <td>${p.price * p.quantity}</td>
        <td><button class="remove-btn" onclick="removeItem(${i})">Remove</button></td>
      </tr>
    `).join("");
  }

  function updateQuantity(i, change) {
    cart[i].quantity += change;
    if(cart[i].quantity < 1) cart[i].quantity = 1; // minimum 1
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  }

  function removeItem(i) {
    cart.splice(i,1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  }

  function checkout() {
    if(cart.length === 0){ alert("Cart is empty!"); return; }
    let total = cart.reduce((sum,p)=> sum + p.price * p.quantity,0);
    alert("Checkout successful! Total: ₹" + total);
    cart = [];
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
  }

  function logout() {
    alert("You have been logged out.");
    localStorage.removeItem("cart"); // clear cart only
    window.location.href = "../index.html"; // adjust relative path
  }

  renderCart();
</script>

</body>
</html>
